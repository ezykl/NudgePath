<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="100%" height="100%">
  <defs>
    <!-- Left diagonal stem: vibrant electric cyan to azure -->
    <linearGradient id="np-cyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Intertwined N and P loop: electric sky to deep royal cobalt blue -->
    <linearGradient id="np-blue-path" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#2563eb" />
      <stop offset="75%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <filter id="np-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2563eb" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#np-glow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left N stem (independent angled stroke with clean rounded ends) -->
    <path d="M 44 95 L 75 35" stroke="url(#np-cyan)" stroke-width="19" />

    <!-- Center Chevron descending from top apex down to bottom chevron point -->
    <path d="M 73 43 L 100 135 L 126 55" stroke="url(#np-blue-path)" stroke-width="19" />

    <!-- P Loop sweeping from apex into the upper right ear and looping back into the center stem -->
    <path d="M 125 55 C 132 32, 160 30, 167 48 C 174 66, 163 88, 142 90 C 122 92, 107 88, 107 88" stroke="url(#np-blue-path)" stroke-width="18" />
  </g>
</svg>
